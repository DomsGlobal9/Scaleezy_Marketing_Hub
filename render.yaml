# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render blueprint for the Scaleezy Marketing Hub backend.
#
# Connect this repository in the Render dashboard (New -> Blueprint) and it
# builds from this file on every push to the tracked branch. Secrets are
# declared sync:false so Render prompts for them once and stores them in the
# service environment - they are never committed here.
services:
  - type: web
    name: scaleezy-backend
    runtime: python
    rootDir: Marketing_backend
    plan: starter
    # Singapore, because the database is Supabase ap-south-1 (Mumbai) and
    # Render has no Indian region. Measured from production: with the app in
    # a US region every database round trip cost 500-900ms, and an
    # authenticated request makes ~5 of them before any real work — that is
    # 3-5 seconds per API call, experienced as "the application is very
    # slow". Singapore-Mumbai is ~60ms: roughly a 10x cut per query, and the
    # users are in India too, so their hop to the app shortens as well.
    region: singapore
    # Migrations run in the build, not the start command: an app that boots
    # before its schema exists serves 500s until someone notices, and the
    # migrations from PR1-PR6 are additive and idempotent.
    # production_integrity runs after migrate and fails the build (non-zero
    # exit) if the live schema, migrations, DB engine or required
    # configuration are not what the code expects - a deploy that would
    # serve 500s is stopped before it replaces the one that works.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py createcachetable && python manage.py sync_ai_catalogue && python manage.py production_integrity
    # Threads, not just workers. Sync workers serve exactly one request each,
    # so two of them meant the whole deployment handled two requests at a
    # time and everything else queued behind them. Almost all of a request
    # here is spent waiting on Postgres or a provider rather than burning
    # CPU, so threads convert that waiting into concurrency: 2 -> 16.
    # `createcachetable` above builds the shared cache the OAuth handshake
    # needs; it is idempotent and safe to re-run on every deploy.
    startCommand: gunicorn scaleezy_backend.wsgi:application --worker-class gthread --workers 2 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FERNET_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # The database task backend is durable. Two worker instances ensure scheduled
  # and immediate social publishing jobs execute without head-of-line blocking
  # when long-running AI poster or video generations occupy a worker pass. Row-level
  # claiming (SKIP LOCKED) protects against duplicate execution across workers.
  - type: worker
    name: scaleezy-worker
    runtime: python
    rootDir: Marketing_backend
    plan: starter
    # Same region as the web service, for the same database-latency reason —
    # the worker is the process that actually runs every generation now.
    region: singapore
    numInstances: 2
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_tasks --interval 5
    # run_tasks finishes its current pass after SIGTERM. Give uploads and
    # provider calls the platform maximum grace period before forced shutdown.
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      # Reuse the web service's Render-managed values. This keeps both
      # processes on the same database and cryptographic identity without
      # exposing or duplicating secrets in the repository.
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: scaleezy-backend
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: scaleezy-backend
          envVarKey: DATABASE_URL
      - key: FERNET_SECRET_KEY
        fromService:
          type: web
          name: scaleezy-backend
          envVarKey: FERNET_SECRET_KEY
      - key: SUPABASE_URL
        fromService:
          type: web
          name: scaleezy-backend
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: scaleezy-backend
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: scaleezy-backend
          envVarKey: GEMINI_API_KEY
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: scaleezy-backend
          envVarKey: OPENAI_API_KEY
