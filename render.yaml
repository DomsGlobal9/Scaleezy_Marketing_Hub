# Render blueprint for the Scaleezy Marketing Hub backend.
#
# Connect this repository in the Render dashboard (New -> Blueprint) and it
# builds from this file on every push to the tracked branch. Secrets are
# declared sync:false so Render prompts for them once and stores them in the
# service environment - they are never committed here.
services:
  - type: web
    name: scaleezy-backend
    runtime: python
    rootDir: Marketing_backend
    plan: starter
    # Migrations run in the build, not the start command: an app that boots
    # before its schema exists serves 500s until someone notices, and the
    # migrations from PR1-PR6 are additive and idempotent.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn scaleezy_backend.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FERNET_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
