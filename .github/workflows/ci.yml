name: CI

on:
  push:
    branches: [main, MSK, Test]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Marketing_backend
    env:
      # Tests run on in-memory SQLite (settings.py switches on `test` in argv);
      # the migration check has no such switch, so it needs DEBUG to allow the
      # SQLite fallback. Neither touches a real database or provider.
      DEBUG: "True"
      FERNET_SECRET_KEY: ${{ secrets.CI_FERNET_SECRET_KEY || 'ci-only-not-a-real-key=' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Marketing_backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput --verbosity 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Marketing_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Marketing_Frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/*.test.mjs
